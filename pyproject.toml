[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "draftscope"
version = "0.1.0"
description = "NVIDIA inference experiments with explicit capability checks and reproducible timing"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "DraftScope contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []
keywords = ["llm-inference", "speculative-decoding", "nvidia", "cuda", "vllm", "benchmarking"]

[project.urls]
Repository = "https://github.com/6bjjjj/draftscope"
Documentation = "https://github.com/6bjjjj/draftscope#readme"
Issues = "https://github.com/6bjjjj/draftscope/issues"
Releases = "https://github.com/6bjjjj/draftscope/releases"

[project.optional-dependencies]
transformers = ["torch>=2.6", "transformers==5.17.0", "accelerate>=1.0", "safetensors>=0.5"]
vllm = ["vllm==0.31.0; sys_platform == 'linux'", "transformers==5.17.0"]
prefix = ["cuda-python>=13.0,<14; sys_platform == 'linux'"]
dev = ["build>=1.2", "ruff>=0.12", "twine>=6.0"]

[project.scripts]
draftscope = "draftscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
draftscope = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research/archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/draftscope/experimental/prefix_v8.py" = ["E402"]
